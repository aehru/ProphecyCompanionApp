name: Setup toolchain
description: Node, Bun, the Bun install cache and the install itself — repeated by every job.

runs:
  using: composite
  steps:
    # The Expo CLI (invoked by `expo lint`) has a hard Node floor — ^20.19.4,
    # ^22.13.0, ^24.3.0 or ^25. Pin it instead of inheriting whatever the runner
    # image happens to ship, so an image bump can't break the build.
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.14 # match the local toolchain (bun.lock)

    # Cache Bun's global install cache, keyed on the lockfile.
    - name: Cache Bun dependencies
      uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          bun-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
