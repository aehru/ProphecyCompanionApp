name: Deploy web

# Publishes the static web export (the desktop/PWA build) to GitHub Pages.
#
# Runs on a release landing in main, and on demand from the Actions tab. Pages
# must be enabled once in Settings → Pages with "GitHub Actions" as the source;
# until then this workflow fails at the deploy step with a clear error.
on:
  push:
    branches: [main]
  workflow_dispatch:

# `pages` + `id-token` are what actions/deploy-pages needs; nothing here writes
# to the repository itself.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race, but let a running one finish — a half-published
# site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Same pins as ci.yml — the Expo CLI has a hard Node floor, and Bun must
      # match the lockfile's toolchain.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The site IS the delivery channel — there is no store review between this
      # job and the users. Metro strips types without checking them, so nothing
      # else would stop a broken build from being published.
      - name: Test
        run: bun run test

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      # Served from the root of prophecyapp.aehru.fr (see public/CNAME), so no
      # base URL is needed and every asset path stays root-relative.
      #
      # If this ever moves back to a project site (https://<user>.github.io/<repo>/),
      # add `env: WEB_BASE_URL: ${{ github.event.repository.name }}` here so the
      # subpath is baked into the asset URLs — app.config.js reads it.
      #
      # Either way a host change is a ONE-WAY DOOR for users: the database lives
      # in OPFS, which browsers scope to the origin, so people would have to
      # export before the move and import after it.
      - name: Build web export
        run: bun run build:web

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
