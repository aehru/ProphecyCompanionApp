name: Native E2E

# Maestro flows on an Android emulator — the half of the app the web suite
# cannot reach: `Alert.alert` confirmations, the native tab bar, the real
# expo-sqlite driver on a device filesystem, a bundle that went through Proguard.
#
# NOT on every PR: this builds a release APK and boots an emulator, so it costs
# ~20 minutes where the web suite costs three. Run it on demand, or put the
# `native-e2e` label on a PR that touches native ground (a dependency bump, a
# migration, anything under android/).
#
# Once a run has gone green, add a nightly trigger:
#   schedule:
#     - cron: '0 3 * * *'
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'native-e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      # The Gradle build needs a JDK; 17 is what AGP 8 expects.
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # android/ is a GENERATED folder and is gitignored — the checkout has no
      # native project at all, and `working-directory: android` fails outright
      # without this. app.json plus the config plugins in plugins/ are the source
      # of truth; prebuild is what turns them into a buildable Gradle project.
      # `--no-install` because the composite setup already installed with bun.
      - name: Generate the native project
        run: bunx expo prebuild --platform android --no-install

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # RELEASE, not debug: a debug APK expects Metro to serve the bundle, so it
      # cannot run standalone. Release also embeds the JS and runs Proguard —
      # which is the build the testers actually get. Signing falls back to the
      # debug key when PROPHECY_UPLOAD_STORE_FILE is absent (plugins/withReleaseSigning.js
      # writes that fallback into the generated build.gradle), so this needs no secrets.
      - name: Build the release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # AVD snapshot cache: booting a cold emulator is most of this job's runtime.
      - name: Cache the AVD
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-${{ runner.os }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Create the AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD created"

      - name: Run the flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # Animations off: Maestro waits on an idle UI, and a running animator
          # never reports idle.
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            maestro test .maestro --format junit --output maestro-report.xml || FAILED=1
            # The view hierarchy of whatever is on screen when the run ends. It
            # is the only thing that answers "the element was not found — was it
            # named differently, or was the app not even up?", and it costs
            # nothing to take.
            maestro hierarchy > maestro-hierarchy.txt 2>&1 || true
            exit ${FAILED:-0}

      # `upload-artifact` does NOT expand `~`, so Maestro's own output (per-flow
      # logs and screenshots, under $HOME) has to be copied into the workspace
      # first or it silently uploads nothing — which is what happened on the run
      # that had five flows fail with no evidence to look at.
      - name: Collect the Maestro output
        if: always()
        run: |
          mkdir -p maestro-output
          cp -r "$HOME/.maestro/tests" maestro-output/ 2>/dev/null || true
          cp maestro-report.xml maestro-hierarchy.txt maestro-output/ 2>/dev/null || true

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-report
          path: maestro-output/
          retention-days: 7
          if-no-files-found: ignore
