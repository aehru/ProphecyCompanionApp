name: CI

# Run the checks on pushes to dev, on PRs targeting dev or main, and on manual
# dispatch from the Actions tab.
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

# A newer push to the same branch/PR cancels the in-progress run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Test
        run: bun run test

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

  # End-to-end against the static web export, in a real browser. It covers what
  # the Node suites structurally cannot — mounting order, provider nesting, route
  # resolution, the async DB round-trip — and, as a side effect, proves
  # `build:web` still builds: until now that only broke after a merge to main,
  # inside the deploy workflow.
  #
  # Separate job so lint/typecheck feedback is not held behind a browser run.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # Keyed on the lockfile, which is what pins the Playwright version the
      # browser build has to match.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      # `--with-deps` installs the system libraries Chromium needs on the runner;
      # they live outside the cached browser directory, so this runs either way.
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      # No WEB_BASE_URL: the suite serves dist/ from the root (scripts/serve-web.ts).
      - name: Build the web export
        run: bun run build:web

      - name: E2E
        run: bun run e2e

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
