<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Création — Caste</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&amp;family=Noto+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#C69C4D}a:hover{color:#E1C37A}
.scr{width:390px;height:844px;background:#141618;color:#E8E4D6;font-family:'Noto Sans',sans-serif;display:flex;flex-direction:column;overflow:hidden;position:relative}
.hdr{flex:none;display:flex;flex-direction:column;gap:8px;padding:6px 4px 12px;background:#1E1F22;border-bottom:1px solid rgba(198,156,77,.25)}
.ib{width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:none;border:0;color:#C69C4D;border-radius:22px;padding:0;text-decoration:none}
.prog{display:flex;gap:4px;padding:0 16px}
.prog span{flex:1;height:4px;border-radius:2px;background:#3A3C40}
.prog .d{background:#C69C4D}
.mut{color:#9A958A;font-size:12px;line-height:1.4}
.sec{font-family:Cinzel,serif;font-size:11px;letter-spacing:.12em;color:#E1C37A;margin:0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cs{position:relative;display:flex;flex-direction:column;gap:3px;padding:12px 12px 10px;border-radius:14px;background:#1E1F22;border:1px solid #3A3C40;overflow:hidden;text-align:left;font:inherit;color:#E8E4D6}
.cs .bar{position:absolute;left:0;right:0;top:0;height:3px}
.cn{font-family:Cinzel,serif;font-weight:600;font-size:15px}
.cs.sel{border:1.5px solid #FFB59B;background:#2A1A12}
.ft{flex:none;display:flex;gap:10px;padding:12px 16px 20px;background:#1E1F22;border-top:1px solid rgba(198,156,77,.25)}
.b{height:48px;border-radius:24px;display:flex;align-items:center;justify-content:center;gap:8px;font:600 15px 'Noto Sans',sans-serif;text-decoration:none}
.rung{flex:1;height:34px;border-radius:8px;border:1px solid #3A3C40;background:none;color:#E8E4D6;font:600 13px 'Noto Sans',sans-serif;padding:0}
.rung.a{background:#4A3A1C;border-color:#C69C4D;color:#E1C37A}
</style>
</helmet>
<div class="scr">
  <div class="hdr">
    <div style="display: flex; align-items: center; gap: 4px">
      <a class="ib" href="CreaDepart.dc.html" aria-label="Quitter la création"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
      <div style="flex: 1; display: flex; flex-direction: column">
        <span class="mut" style="font-size: 11px">Étape 1 sur 5 · brouillon conservé</span>
        <span style="font-family: Cinzel, serif; font-weight: 600; font-size: 18px">Votre caste</span>
      </div>
    </div>
    <div class="prog" aria-hidden="true"><span class="d"></span><span></span><span></span><span></span><span></span></div>
  </div>

  <div style="flex: 1; overflow: hidden; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px">
    <p class="mut" style="margin: 0; font-size: 13px">La caste dit d’où vient le personnage et ce qu’il peut devenir. Chacune sert un Grand Dragon.</p>

    <div class="grid" role="radiogroup" aria-label="Caste">
      <button class="cs" role="radio" aria-checked="false"><span class="bar" style="background: #BBC7DB"></span><span class="cn">Artisan</span><span class="mut">Kezyr</span></button>
      <button class="cs sel" role="radio" aria-checked="true"><span class="bar" style="background: #FFB59B"></span><span style="display: flex; justify-content: space-between; align-items: center"><span class="cn">Combattant</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFB59B" stroke-width="2" aria-hidden="true"><path d="M5 12.5 10 17.5 19 7"></path></svg></span><span class="mut" style="color: #FFB59B">Kroryn</span></button>
      <button class="cs" role="radio" aria-checked="false"><span class="bar" style="background: #FFBA30"></span><span class="cn">Commerçant</span><span class="mut">Khy</span></button>
      <button class="cs" role="radio" aria-checked="false"><span class="bar" style="background: #99CBFF"></span><span class="cn">Érudit</span><span class="mut">Ozyr</span></button>
      <button class="cs" role="radio" aria-checked="false"><span class="bar" style="background: #CCBEFF"></span><span class="cn">Mage</span><span class="mut">Nenya</span></button>
      <button class="cs" role="radio" aria-checked="false"><span class="bar" style="background: #99D686"></span><span class="cn">Prodige</span><span class="mut">Heyra</span></button>
      <button class="cs" role="radio" aria-checked="false"><span class="bar" style="background: #DCC2A7"></span><span class="cn">Protecteur</span><span class="mut">Brorne</span></button>
      <button class="cs" role="radio" aria-checked="false"><span class="bar" style="background: #73D5DE"></span><span class="cn">Voyageur</span><span class="mut">Szyl</span></button>
    </div>
    <button style="align-self: flex-start; background: none; border: 0; padding: 0; color: #9A958A; font: 500 13px 'Noto Sans',sans-serif; text-decoration: underline">Sans caste</button>

    <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 14px; background: #1E1F22; border: 1px solid rgba(198,156,77,.28)">
      <div style="display: flex; justify-content: space-between; align-items: baseline"><h2 class="sec">STATUT DE DÉPART</h2><span class="mut">Combattant</span></div>
      <div style="display: flex; gap: 4px" role="radiogroup" aria-label="Statut">
        <button class="rung">0</button><button class="rung a">1</button><button class="rung">2</button><button class="rung">3</button><button class="rung">4</button><button class="rung">5</button>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-weight: 600; font-size: 14px">Apprenti</span>
        <span class="mut">Requis : une Compétence d’arme à 6, Physique à 4</span>
      </div>
      <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #9A958A"><input type="checkbox" style="width: 18px; height: 18px; accent-color: #C69C4D"> Rejoindre Les Ordres Noirs</label>
    </div>
  </div>

  <div class="ft">
    <a class="b" href="CreaDepart.dc.html" style="flex: 1; border: 1px solid rgba(198,156,77,.45); color: #E1C37A">Précédent</a>
    <a class="b" href="CreaTendances.dc.html" style="flex: 2; background: #C69C4D; color: #141618">Suivant : Identité<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9.5 5.5 16 12l-6.5 6.5"></path></svg></a>
  </div>
</div>
</x-dc>

</html>
