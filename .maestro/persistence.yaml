# The character survives a full app restart.
#
# This is the native expo-sqlite driver on a real device filesystem — a
# different code path from the wasm build the web suite exercises, and the one
# that carries the migrations. A dropped `await` in a repository shows up here
# and nowhere else: the row looks written until the process goes away.
appId: fr.aehru.prophecyapp
tags:
  - smoke
---
- runFlow:
    file: subflows/launch.yaml

- runFlow:
    file: subflows/create-character.yaml
    env:
      NOM: Kaelen
- back
- assertVisible:
    id: 'character-row-1'

- stopApp
# No clearState: the DB from the previous launch is exactly the point. No
# subflow either, for the same reason — subflows/launch.yaml wipes it.
- launchApp
# Generous, like the cold launch: the second start still reopens the database
# and walks the migration table before the list can render.
- extendedWaitUntil:
    visible:
      id: 'character-row-1'
    timeout: 120000
- assertVisible: 'Kaelen'
