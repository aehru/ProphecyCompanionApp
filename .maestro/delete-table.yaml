# A destructive confirmation, end to end on a device.
#
# It used to be the ONLY place these were testable: `Alert.alert` is a no-op on
# react-native-web, so the web suite could not reach a single one. Since the
# switch to `@/lib/alert` (a DsDialog on every platform) `e2e/alerts.spec.ts`
# covers the same shape in the browser — this flow now guards the OTHER half:
# that the dialog still draws, still takes a tap and still runs its handler on a
# real device, over the real sqlite driver.
#
# The campaign delete rather than the character one: it is the shape with the
# most to lose (the row, the notes, and the server-side purge) in one tap.
appId: fr.aehru.prophecyapp
tags:
  - smoke
---
- launchApp:
    clearState: true

- runFlow:
    file: subflows/create-table.yaml
    env:
      NOM: Table Maestro

- back
- assertVisible:
    id: 'campaign-row-1'

- tapOn:
    id: 'campaign-delete-1'
# `alert-destructive` / `alert-cancel` are stamped by the alert host, so the
# selector no longer depends on French copy — which also settles the old snag
# that a character's confirm button repeats its own title (« Supprimer »).
- assertVisible: 'Supprimer la table ?'
- assertVisible:
    id: 'alert-cancel'
- tapOn:
    id: 'alert-destructive'

- extendedWaitUntil:
    visible:
      id: 'campaigns-empty'
    timeout: 15000
